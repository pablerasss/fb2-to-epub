<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FB2 a EPUB - Convertidor Profesional</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .drop-zone {
            border: 3px dashed #667eea;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
            margin-bottom: 20px;
        }

        .drop-zone:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .drop-zone.active {
            border-color: #764ba2;
            background: #e8ebff;
        }

        .drop-zone-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .drop-zone-text {
            color: #333;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .drop-zone-subtext {
            color: #999;
            font-size: 13px;
        }

        input[type="file"] {
            display: none;
        }

        .file-input {
            margin-top: 15px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .file-info {
            background: #f0f9ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            display: none;
        }

        .file-info.show {
            display: block;
        }

        .file-info-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .file-info-size {
            font-size: 12px;
            color: #666;
        }

        .progress-container {
            margin: 20px 0;
            display: none;
        }

        .progress-container.show {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 12px;
            color: #666;
            text-align: center;
        }

        .status-message {
            margin: 15px 0;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
        }

        .status-message.show {
            display: block;
        }

        .status-message.info {
            background: #e3f2fd;
            color: #1976d2;
            border-left: 4px solid #1976d2;
        }

        .status-message.success {
            background: #e8f5e9;
            color: #388e3c;
            border-left: 4px solid #388e3c;
        }

        .status-message.error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #c62828;
        }

        .options {
            background: #fafafa;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            display: none;
        }

        .options.show {
            display: block;
        }

        .option-group {
            margin-bottom: 12px;
        }

        .option-group label {
            display: flex;
            align-items: center;
            font-size: 13px;
            cursor: pointer;
            color: #333;
        }

        .option-group input[type="checkbox"] {
            margin-right: 8px;
            cursor: pointer;
        }

        .download-btn {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            font-size: 16px;
            display: none;
        }

        .download-btn.show {
            display: block;
        }

        .info-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            color: #856404;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 22px;
            }

            .drop-zone {
                padding: 30px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 FB2 → EPUB</h1>
            <p>Convertidor profesional para Kindle</p>
        </div>

        <div class="drop-zone" id="dropZone">
            <div class="drop-zone-icon">📖</div>
            <div class="drop-zone-text">Arrastra tu archivo FB2 aquí</div>
            <div class="drop-zone-subtext">o haz clic para seleccionar</div>
            <input type="file" id="fileInput" accept=".fb2" />
        </div>

        <div class="file-info" id="fileInfo">
            <div class="file-info-name" id="fileName"></div>
            <div class="file-info-size" id="fileSize"></div>
        </div>

        <div class="options" id="options">
            <div class="option-group">
                <label>
                    <input type="checkbox" id="preserveImages" checked />
                    Preservar imágenes
                </label>
            </div>
            <div class="option-group">
                <label>
                    <input type="checkbox" id="preserveStyles" checked />
                    Preservar estilos CSS
                </label>
            </div>
            <div class="option-group">
                <label>
                    <input type="checkbox" id="optimizeKindle" checked />
                    Optimizar para Kindle
                </label>
            </div>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">Procesando...</div>
        </div>

        <div class="status-message" id="statusMessage"></div>

        <button class="btn download-btn" id="downloadBtn" onclick="downloadEpub()">
            ✓ Descargar EPUB
        </button>

        <div class="info-box">
            <strong>💡 Consejo:</strong> El archivo EPUB generado es compatible con Kindle, lectores e-ink y aplicaciones móviles. La conversión preserva capítulos, párrafos, énfasis y imágenes.
        </div>
    </div>

    <script>
        let epubData = null;
        let currentFile = null;

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const options = document.getElementById('options');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const statusMessage = document.getElementById('statusMessage');
        const downloadBtn = document.getElementById('downloadBtn');

        // Drag and drop
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('active');
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('active');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('active');
            const files = e.dataTransfer.files;
            if (files.length) handleFile(files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            if (!file.name.endsWith('.fb2')) {
                showStatus('Por favor selecciona un archivo FB2 válido', 'error');
                return;
            }

            currentFile = file;
            fileName.textContent = `Archivo: ${file.name}`;
            fileSize.textContent = `Tamaño: ${(file.size / 1024).toFixed(1)} KB`;
            fileInfo.classList.add('show');
            options.classList.add('show');
            downloadBtn.classList.remove('show');
            epubData = null;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    convertFb2ToEpub(e.target.result);
                } catch (error) {
                    showStatus(`Error: ${error.message}`, 'error');
                    hideProgress();
                }
            };
            reader.readAsText(file);
        }

        function showStatus(msg, type = 'info') {
            statusMessage.textContent = msg;
            statusMessage.className = `status-message show ${type}`;
        }

        function hideStatus() {
            statusMessage.classList.remove('show');
        }

        function showProgress() {
            progressContainer.classList.add('show');
            updateProgress(0, 'Inicializando...');
        }

        function hideProgress() {
            progressContainer.classList.remove('show');
        }

        function updateProgress(percent, text) {
            progressFill.style.width = percent + '%';
            progressText.textContent = text;
        }

        function convertFb2ToEpub(fb2Content) {
            showProgress();
            updateProgress(10, 'Parseando FB2...');

            try {
                const parser = new DOMParser();
                const fb2Doc = parser.parseFromString(fb2Content, 'text/xml');

                if (fb2Doc.getElementsByTagName('parsererror').length) {
                    throw new Error('XML no válido en el archivo FB2');
                }

                updateProgress(30, 'Extrayendo contenido...');
                const bookData = extractBookData(fb2Doc);

                updateProgress(60, 'Generando EPUB...');
                const epub = new JSZip();

                // Estructura EPUB
                addMimetypeFile(epub);
                addContainerXml(epub);
                addPackageXml(epub, bookData);
                addChapterXml(epub, bookData);
                addStylesheet(epub);

                // Imágenes
                if (document.getElementById('preserveImages').checked && bookData.images.length) {
                    updateProgress(70, 'Procesando imágenes...');
                    addImagesToEpub(epub, bookData);
                }

                updateProgress(90, 'Finalizando...');
                epub.generateAsync({ type: 'blob' }).then((blob) => {
                    epubData = blob;
                    updateProgress(100, '¡Listo! Descarga disponible');
                    downloadBtn.classList.add('show');
                    showStatus('✓ Conversión completada exitosamente', 'success');
                    hideProgress();
                });

            } catch (error) {
                showStatus(`Error de conversión: ${error.message}`, 'error');
                hideProgress();
            }
        }

        function extractBookData(fb2Doc) {
            const bookData = {
                title: '',
                author: '',
                chapters: [],
                images: [],
                description: '',
                cover: null
            };

            // Título
            const titleElem = fb2Doc.querySelector('title-info > book-title');
            if (titleElem) bookData.title = titleElem.textContent || 'Sin título';

            // Autor
            const authorElem = fb2Doc.querySelector('title-info > author > first-name, title-info > author > middle-name, title-info > author > last-name');
            if (authorElem) {
                const firstNameElem = fb2Doc.querySelector('title-info > author > first-name');
                const lastNameElem = fb2Doc.querySelector('title-info > author > last-name');
                const firstName = firstNameElem?.textContent || '';
                const lastName = lastNameElem?.textContent || '';
                bookData.author = `${firstName} ${lastName}`.trim() || 'Autor desconocido';
            }

            // Descripción
            const descElem = fb2Doc.querySelector('title-info > annotation');
            if (descElem) bookData.description = descElem.textContent;

            // Portada
            const coverImageElem = fb2Doc.querySelector('title-info > coverpage > image');
            if (coverImageElem) {
                bookData.cover = coverImageElem.getAttribute('xlink:href') || coverImageElem.getAttribute('href');
            }

            // Capítulos
            const sections = fb2Doc.querySelectorAll('body > section, body > section section');
            let chapterNum = 0;

            sections.forEach((section) => {
                const chapter = extractChapter(section, chapterNum);
                if (chapter) {
                    bookData.chapters.push(chapter);
                    chapterNum++;
                }
            });

            // Imágenes
            const binaries = fb2Doc.querySelectorAll('binary');
            binaries.forEach((binary) => {
                const id = binary.getAttribute('id');
                const contentType = binary.getAttribute('content-type');
                const imageData = binary.textContent;
                if (id && contentType && imageData) {
                    bookData.images.push({ id, contentType, imageData });
                }
            });

            return bookData;
        }

        function extractChapter(section, index) {
            const titleElem = section.querySelector(':scope > title > p, :scope > title');
            const title = titleElem?.textContent?.trim() || `Capítulo ${index + 1}`;

            const paragraphs = [];
            const pElems = section.querySelectorAll(':scope > p, :scope > section > p');

            pElems.forEach((p) => {
                if (p.closest('section') === section) {
                    const html = cleanParagraph(p);
                    if (html.trim()) paragraphs.push(html);
                }
            });

            // Subsecciones
            const subsections = section.querySelectorAll(':scope > section');
            subsections.forEach((sub) => {
                const subTitle = sub.querySelector(':scope > title > p, :scope > title');
                if (subTitle) {
                    paragraphs.push(`<h3>${escapeHtml(subTitle.textContent)}</h3>`);
                }
                const subPs = sub.querySelectorAll(':scope > p');
                subPs.forEach((p) => {
                    const html = cleanParagraph(p);
                    if (html.trim()) paragraphs.push(html);
                });
            });

            return { id: `chapter${index}`, title, paragraphs };
        }

        function cleanParagraph(p) {
            let html = '';

            p.childNodes.forEach((node) => {
                if (node.nodeType === 3) {
                    html += escapeHtml(node.textContent);
                } else if (node.nodeType === 1) {
                    const tag = node.tagName.toLowerCase();

                    if (tag === 'strong' || tag === 'emphasis') {
                        const innerTag = tag === 'strong' ? 'strong' : 'em';
                        html += `<${innerTag}>${cleanParagraph(node)}</${innerTag}>`;
                    } else if (tag === 'image') {
                        const href = node.getAttribute('xlink:href') || node.getAttribute('href');
                        if (href) {
                            html += `<img src="${escapeHtml(href)}" alt="imagen" />`;
                        }
                    } else if (tag === 'a') {
                        const href = node.getAttribute('xlink:href') || node.getAttribute('href');
                        html += `<a href="${escapeHtml(href || '#')}">${cleanParagraph(node)}</a>`;
                    } else {
                        html += cleanParagraph(node);
                    }
                }
            });

            return html;
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return (text || '').replace(/[&<>"']/g, (m) => map[m]);
        }

        function addMimetypeFile(epub) {
            epub.file('mimetype', 'application/epub+zip');
        }

        function addContainerXml(epub) {
            const containerXml = `<?xml version="1.0" encoding="UTF-8"?>
<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">
  <rootfiles>
    <rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml" />
  </rootfiles>
</container>`;
            epub.folder('META-INF').file('container.xml', containerXml);
        }

        function addPackageXml(epub, bookData) {
            const timestamp = new Date().toISOString();
            const manifestItems = bookData.chapters.map((ch) => 
                `    <item id="${ch.id}" href="chapters/${ch.id}.xhtml" media-type="application/xhtml+xml" />`
            ).join('\n');

            const spineItems = bookData.chapters.map((ch) => 
                `    <itemref idref="${ch.id}" />`
            ).join('\n');

            const imagesToc = bookData.images.map((img) => {
                const ext = img.contentType.includes('png') ? 'png' : img.contentType.includes('jpeg') ? 'jpg' : 'gif';
                return `    <item id="${img.id}" href="images/${img.id}.${ext}" media-type="image/${ext === 'jpg' ? 'jpeg' : ext}" />`;
            }).join('\n');

            const packageXml = `<?xml version="1.0" encoding="UTF-8"?>
<package xmlns="http://www.idpf.org/2007/opf" unique-identifier="uuid_id" version="2.0">
  <metadata xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:opf="http://www.idpf.org/2007/opf">
    <dc:title>${escapeHtml(bookData.title)}</dc:title>
    <dc:creator>${escapeHtml(bookData.author)}</dc:creator>
    <dc:description>${escapeHtml(bookData.description)}</dc:description>
    <dc:date>${timestamp}</dc:date>
    <dc:identifier id="uuid_id">urn:uuid:${generateUUID()}</dc:identifier>
    <dc:language>es</dc:language>
  </metadata>
  <manifest>
    <item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml" />
    <item id="styles" href="styles.css" media-type="text/css" />
${manifestItems}
${imagesToc}
  </manifest>
  <spine toc="ncx">
${spineItems}
  </spine>
</package>`;
            epub.folder('OEBPS').file('content.opf', packageXml);
        }

        function addChapterXml(epub, bookData) {
            bookData.chapters.forEach((chapter) => {
                const xhtml = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <title>${escapeHtml(chapter.title)}</title>
  <link rel="stylesheet" href="../styles.css" type="text/css" />
</head>
<body>
  <h2>${escapeHtml(chapter.title)}</h2>
${chapter.paragraphs.map((p) => `  <p>${p}</p>`).join('\n')}
</body>
</html>`;
                epub.folder('OEBPS/chapters').file(`${chapter.id}.xhtml`, xhtml);
            });
        }

        function addStylesheet(epub) {
            const css = `
body {
  font-family: Georgia, serif;
  line-height: 1.6;
  margin: 0;
  padding: 1em;
  max-width: 40em;
}

h2 {
  font-size: 1.5em;
  font-weight: bold;
  margin-top: 1.5em;
  margin-bottom: 0.5em;
  page-break-before: always;
}

h3 {
  font-size: 1.2em;
  font-weight: bold;
  margin-top: 1em;
  margin-bottom: 0.5em;
}

p {
  margin: 0.5em 0;
  text-indent: 1.5em;
  text-align: justify;
}

p:first-of-type {
  text-indent: 0;
}

em, i {
  font-style: italic;
}

strong, b {
  font-weight: bold;
}

a {
  color: #0066cc;
  text-decoration: underline;
}

img {
  max-width: 100%;
  height: auto;
  display: block;
  margin: 1em auto;
}

.subtitle {
  font-size: 0.9em;
  font-style: italic;
  margin: 0.5em 0;
}

@media (max-width: 600px) {
  body {
    font-size: 0.9em;
    padding: 0.5em;
  }
  h2 {
    font-size: 1.3em;
  }
}
`;
            epub.folder('OEBPS').file('styles.css', css);
        }

        function addImagesToEpub(epub, bookData) {
            bookData.images.forEach((img) => {
                const ext = img.contentType.includes('png') ? 'png' : img.contentType.includes('jpeg') ? 'jpg' : 'gif';
                try {
                    const binaryData = Uint8Array.from(atob(img.imageData), c => c.charCodeAt(0));
                    epub.folder('OEBPS/images').file(`${img.id}.${ext}`, binaryData, { binary: true });
                } catch (e) {
                    console.warn(`No se pudo procesar imagen ${img.id}:`, e);
                }
            });
        }

        function addTocNcx(epub, bookData) {
            const navPoints = bookData.chapters.map((ch, i) => `
    <navPoint id="navpoint-${i}" playOrder="${i + 1}">
      <navLabel>
        <text>${escapeHtml(ch.title)}</text>
      </navLabel>
      <content src="chapters/${ch.id}.xhtml" />
    </navPoint>`).join('\n');

            const tocNcx = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE ncx PUBLIC "-//NISO//DTD ncx 2005-1//EN" "http://www.daisy.org/z3986/2005/ncx-2005-1.dtd">
<ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1">
  <head>
    <meta name="dtb:uid" content="urn:uuid:${generateUUID()}" />
    <meta name="dtb:depth" content="1" />
    <meta name="dtb:totalPageCount" content="0" />
    <meta name="dtb:maxPageNumber" content="0" />
  </head>
  <docTitle>
    <text>${escapeHtml(bookData.title)}</text>
  </docTitle>
  <navMap>
${navPoints}
  </navMap>
</ncx>`;
            epub.folder('OEBPS').file('toc.ncx', tocNcx);
        }

        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        function downloadEpub() {
            if (!epubData) return;

            const url = URL.createObjectURL(epubData);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${currentFile.name.replace('.fb2', '')}.epub`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
